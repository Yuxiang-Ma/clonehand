[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "node_modules", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/export_model_catalog.py" = ["E402"]
"scripts/vendor_model.py" = ["E402"]
"scripts/fetch_music.py" = ["E402"]
