# Checks the project, builds the static web demo (MuJoCo in the browser, no MUSIC muscles),
# and publishes it to GitHub Pages. MUSIC is never fetched here: it has no license.
name: Web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          npm ci
      - name: Check
        env:
          CLONEHAND_MUSIC_DIR: /nonexistent
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          npm run typecheck
          .venv/bin/python -m pytest -q
      - name: Build web demo
        env:
          CLONEHAND_MUSIC_DIR: /nonexistent
        run: npm run build:demo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
